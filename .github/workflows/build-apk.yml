name: Build Legitiv Linux APK

on:
  workflow_dispatch:
  push:
    paths:
      - "LegitivLinux-embedded-0.3.0.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project archive
        run: |
          unzip -q LegitivLinux-embedded-0.3.0.zip -d source

      - name: Build debug APK
        run: |
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper gradlew was not found in the archive"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegitivLinux-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
