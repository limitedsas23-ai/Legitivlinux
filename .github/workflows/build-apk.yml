name: Build Legitiv Linux APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -o "$(find . -maxdepth 1 -name '*.zip' -print -quit)" -d source
          find source -name gradlew -type f -print -quit

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          cd "$(dirname "$(find source -name gradlew -type f -print -quit)")"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegitivLinux-debug-apk
          path: source/**/build/outputs/apk/**/*.apk
