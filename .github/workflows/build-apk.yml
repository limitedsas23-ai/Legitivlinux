name: Build Legitiv Linux APK

on:
  workflow_dispatch:
  push:
    paths:
      - "LegitivLinux-embedded-0.3.0.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project archive
        run: unzip -q LegitivLinux-embedded-0.3.0.zip -d source

      - name: Find project and build APK
        run: |
          PROJECT_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "Не найден settings.gradle или settings.gradle.kts"
            find source -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegitivLinux-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
